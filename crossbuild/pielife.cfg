// this file will be created whenever you start the mod
// if you want to reset this file, just delete it

cfg_version = 6

// Disable all features that connect to third-party services to prevent
// leakage of any account info or IPs to anyone but Jason's servers or
// any custom server you choose to connect to. This currently includes:
//
//  - The Phex chat system
//  - The OHOLCurse button
//  - The Services button
//
// Any future opt-out networked features in the official selb/YumLife
// distribution will respect this option.
private_mode = no

key_up = w
key_down = s
key_left = a
key_right = d
key_center = <space>

key_backpack = q
key_takeOffBackpack = b
key_pocket = t
key_eat = e
key_baby = c

key_show_help = h
key_show_names = n
key_show_cords = z
key_show_playersinrange = p
key_show_deathmessages = 
key_show_homecords = g
key_show_hostiletiles = u
key_show_hostileplayers = i

key_remembercords = r
key_fixcamera = f
key_xray = x
key_search = j
key_findyum = y
key_hideplayers = 
key_showgrid = k

key_confirmexit = %

key_phex = #
key_minitech = v

// WARNING: Jason doesnt want us to upload bogus photos and you might get banned if you do, read: OneLife/photoServer/protocol.txt
// How to use:
// 1. Set key_takephoto to a key you want
// 2. Press the key in game, a photo frame will appear, move the mouse around and zoom in and out to choose your photo
// 3. Press the key again to make the photo, it will be saved in the screenshots folder
// 4. If you want to upload it make an image with the camera in game, the last photo you took will be uploaded
//    Hold a camera and rightclick on a 'Protected Stack of Photo Paper'
//    Place the camera on the ground and rightlick it while it is rewinding
key_takephoto = 

// filename of the main font (in the graphics directory)
font_filename = font_32_64_yum.tga

init_show_names = first // none, first, or full
init_show_selectedplayerinfo = no // draw names bigger and show age when hovering over a player
init_show_cords = yes
init_show_playersinrange = no // no, nearby, or server
playersinrange_counts_self = yes
init_show_deathmessages = yes
init_show_homecords = no
init_show_hostiletiles = yes
init_show_hostileplayers = yes
init_show_vision = yes

phex_enabled = yes
phex_ip = phex.antinoid.com
phex_port = 6567
phex_coords = yes
phex_debug = yes
phex_side = auto // auto = avoid minitech, left = always left, right = always right
phex_start_offline = no // disable auto connect to phex
phex_skip_tos = yes // skip auto /tos (terms of service) on connect

// Permit sending your email address to the Phex server so that it can
// authenticate your account with the OHOL service.
//
// To allow you to protect your anonymity, this is off by default.
// (Fake Steam 12345@steamgames.com addresses are sent regardless.)
//
// [!] WARNING: DO NOT enable this unless you trust the Phex server
//              administrator with your email address!
phex_send_email = yes

keep_button_pressed_to_fixcamera = yes
keep_button_pressed_to_findyum = yes
keep_button_pressed_to_showgrid = yes

keep_button_pressed_to_xray = yes
xray_opacity = 3 // how visible objects should be, can be 0 - 10

draw_yumcolor = no
draw_yumpulsate = yes

search_include_hash_text = no
draw_searchtext = yes
draw_searchrec = no
draw_searchpulsate = yes

add_baby_coords_to_list = no

automatic_data_update = yes
hetuw_log = yes // will create a log file 'pielog.txt' that logs different events
chat_delay = 0 // wait atleast X time before sending the next text (10 = 1 second) - set it to 0 to deactivate it

draw_mushroom_effect = yes
draw_hunger_warning = no
skip_rocket_cutscene = no

// Reduce action delay by the given percentage, 0-100.
// Higher values may cause server disconnects. 
reduce_delay = 100
// Set max zoom out. This one goes to 11.
zoom_limit = 11
// RGB OPACITY EX: 231 23 10 30
shader_default = 0000

minitech_enabled = yes
minitech_stay_minimized = no
minitech_tooltips_enabled = yes

// names to automatically give when holding your bb; separate with commas
// for example: auto_male_names = MATTHEW, MARK, LUKE, JOHN
auto_male_names = 
auto_female_names = 
Alternate_PID = yes
auto_name_mode = shuffle // sequential, shuffle, or off

// comma-separated auto /DIE options to pre-select on startup
// (example: ARCTIC,JUNGLE,DESERT,MALE)
auto_die_unless = 
